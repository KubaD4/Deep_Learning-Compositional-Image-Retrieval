<text x="734" y="44" class="title" fill="#222">Training pair factory</text>
<rect x="1090" y="20" width="340" height="980" rx="12" fill="#F1ECFF" stroke="#7A55C7" stroke-width="2" opacity="0.55"/>
<text x="1104" y="44" class="title" fill="#222">Learned sequential gate</text>
<rect x="1470" y="20" width="380" height="980" rx="12" fill="#FFECEC" stroke="#C75555" stroke-width="2" opacity="0.55"/>
<text x="1484" y="44" class="title" fill="#222">Final inference &amp; evaluation</text>
