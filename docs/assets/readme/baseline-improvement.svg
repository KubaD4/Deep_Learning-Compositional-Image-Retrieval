<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">Improvement over the direct CLIP baseline</title>
  <desc id="desc">The strongest zero-shot CLIP method improves the baseline by 72.5 percent, the learned hybrid core by 266.1 percent, and the final system by 341.5 percent.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f5"/>
    </linearGradient>
    <linearGradient id="finalBar" x1="0" x2="1">
      <stop offset="0" stop-color="#f4a261"/>
      <stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="680" rx="28" fill="url(#background)"/>
  <text x="70" y="78" fill="#0f172a" font-family="Avenir Next, Segoe UI, sans-serif" font-size="38" font-weight="700">
    From CLIP arithmetic to a verified retriever
  </text>
  <text x="70" y="116" fill="#475569" font-family="Avenir Next, Segoe UI, sans-serif" font-size="19">
    Relative lift in query-balanced top-10 success across 33,052 official source/query cases
  </text>

  <line x1="300" x2="1285" y1="565" y2="565" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="300" x2="300" y1="164" y2="565" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#64748b" font-family="Avenir Next, Segoe UI, sans-serif" font-size="17">
    <text x="276" y="571" text-anchor="end">0%</text>
    <text x="276" y="460" text-anchor="end">+100%</text>
    <text x="276" y="349" text-anchor="end">+200%</text>
    <text x="276" y="238" text-anchor="end">+300%</text>
  </g>
  <g stroke="#dbe4ea" stroke-width="1">
    <line x1="300" x2="1285" y1="454" y2="454"/>
    <line x1="300" x2="1285" y1="343" y2="343"/>
    <line x1="300" x2="1285" y1="232" y2="232"/>
  </g>

  <g font-family="Avenir Next, Segoe UI, sans-serif">
    <text x="70" y="210" fill="#334155" font-size="22" font-weight="600">Direct CLIP baseline</text>
    <rect x="300" y="175" width="18" height="56" rx="9" fill="#94a3b8"/>
    <text x="335" y="210" fill="#64748b" font-size="19" font-weight="600">reference (1.00x)</text>

    <text x="70" y="310" fill="#334155" font-size="22" font-weight="600">Contrastive CLIP edits</text>
    <rect x="300" y="271" width="210" height="58" rx="12" fill="#2a9d8f" filter="url(#shadow)"/>
    <text x="530" y="309" fill="#0f766e" font-size="21" font-weight="700">+72.5% (1.73x)</text>

    <text x="70" y="410" fill="#334155" font-size="22" font-weight="600">Learned hybrid core</text>
    <rect x="300" y="371" width="770" height="58" rx="12" fill="#f4a261" filter="url(#shadow)"/>
    <text x="1090" y="409" fill="#9a3412" font-size="21" font-weight="700">+266.1% (3.66x)</text>

    <text x="70" y="510" fill="#0f172a" font-size="22" font-weight="700">Full system + verifier</text>
    <rect x="300" y="471" width="985" height="58" rx="12" fill="url(#finalBar)" filter="url(#shadow)"/>
    <text x="1260" y="455" text-anchor="end" fill="#c2410c" font-size="27" font-weight="800">+341.5%</text>
    <text x="1260" y="510" text-anchor="end" fill="#ffffff" font-size="22" font-weight="800">4.41x direct CLIP / 2.56x strongest zero-shot</text>
  </g>

  <rect x="70" y="602" width="1260" height="1" fill="#dbe4ea"/>
  <text x="70" y="636" fill="#64748b" font-family="Avenir Next, Segoe UI, sans-serif" font-size="16">
    Recall@10 here is the percentage of source/query cases with at least one officially valid target in the first ten results.
  </text>
</svg>
